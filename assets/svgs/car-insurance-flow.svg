<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1100" width="720" height="1100">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0EA5E9" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="1100" fill="#F8FAFC"/>

  <!-- Title -->
  <rect x="40" y="28" width="640" height="64" rx="16" fill="url(#heroGrad)" filter="url(#shadow)"/>
  <text x="360" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Car Insurance — Step-by-Step Flow</text>
  <text x="360" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#E0F2FE">SwiftPassenger Customer App</text>

  <!-- Helper styles via repeated groups -->
  <!-- Node: Home -->
  <g filter="url(#shadow)">
    <rect x="260" y="120" width="200" height="48" rx="24" fill="#0F172A"/>
    <text x="360" y="150" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Home Screen</text>
  </g>
  <line x1="360" y1="168" x2="360" y2="198" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Landing -->
  <g filter="url(#shadow)">
    <rect x="220" y="200" width="280" height="56" rx="16" fill="url(#nodeGrad)"/>
    <text x="360" y="225" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Car Insurance Landing</text>
    <text x="360" y="243" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#E0F2FE">Get New Policy  ·  My Policies</text>
  </g>

  <!-- Branch lines -->
  <path d="M 300 256 L 300 280 L 180 280 L 180 298" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 420 256 L 420 280 L 540 280 L 540 298" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Left branch label -->
  <text x="180" y="275" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#0EA5E9" font-weight="600">NEW POLICY</text>
  <!-- Right branch label -->
  <text x="540" y="275" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6366F1" font-weight="600">EXISTING</text>

  <!-- Step 1 Vehicle -->
  <g filter="url(#shadow)">
    <rect x="70" y="300" width="220" height="52" rx="14" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <circle cx="98" cy="326" r="14" fill="#0EA5E9"/>
    <text x="98" y="331" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
    <text x="195" y="322" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Vehicle Details</text>
    <text x="195" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Reg · Brand · Model · Year</text>
  </g>
  <line x1="180" y1="352" x2="180" y2="378" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 Personal -->
  <g filter="url(#shadow)">
    <rect x="70" y="380" width="220" height="52" rx="14" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <circle cx="98" cy="406" r="14" fill="#0EA5E9"/>
    <text x="98" y="411" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
    <text x="195" y="402" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Personal Details</text>
    <text x="195" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Name · Mobile · Email · Nominee</text>
  </g>
  <line x1="180" y1="432" x2="180" y2="458" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 Coverage -->
  <g filter="url(#shadow)">
    <rect x="70" y="460" width="220" height="52" rx="14" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <circle cx="98" cy="486" r="14" fill="#0EA5E9"/>
    <text x="98" y="491" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
    <text x="195" y="482" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Coverage Selection</text>
    <text x="195" y="500" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Type · IDV · Add-ons</text>
  </g>
  <line x1="180" y1="512" x2="180" y2="538" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 Quote -->
  <g filter="url(#shadow)">
    <rect x="70" y="540" width="220" height="52" rx="14" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <circle cx="98" cy="566" r="14" fill="#0EA5E9"/>
    <text x="98" y="571" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
    <text x="195" y="562" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Quote Summary</text>
    <text x="195" y="580" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Premium break-up · Buy Now</text>
  </g>
  <line x1="180" y1="592" x2="180" y2="618" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Review -->
  <g filter="url(#shadow)">
    <rect x="70" y="620" width="220" height="48" rx="14" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <text x="180" y="649" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Policy Review</text>
  </g>
  <line x1="180" y1="668" x2="180" y2="694" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Payment -->
  <g filter="url(#shadow)">
    <rect x="70" y="696" width="220" height="48" rx="14" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <text x="180" y="725" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Payment</text>
  </g>
  <line x1="180" y1="744" x2="180" y2="770" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Success -->
  <g filter="url(#shadow)">
    <rect x="70" y="772" width="220" height="52" rx="14" fill="#16A34A"/>
    <text x="180" y="795" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">✓ Policy Success</text>
    <text x="180" y="813" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#DCFCE7">Policy No · Download PDF</text>
  </g>

  <!-- Arrow from success to My Policies -->
  <path d="M 290 798 L 420 798 L 420 350" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Right side: My Policies -->
  <g filter="url(#shadow)">
    <rect x="430" y="300" width="220" height="52" rx="14" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
    <text x="540" y="322" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">My Policies</text>
    <text x="540" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Active list · Quick actions</text>
  </g>

  <!-- Actions from My Policies -->
  <line x1="540" y1="352" x2="540" y2="378" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="430" y="380" width="100" height="40" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="480" y="405" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4338CA">Claim</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="550" y="380" width="100" height="40" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="600" y="405" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4338CA">Renew</text>
  </g>

  <line x1="480" y1="420" x2="480" y2="448" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Claim flow -->
  <g filter="url(#shadow)">
    <rect x="430" y="450" width="220" height="52" rx="14" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
    <text x="540" y="472" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Claim Flow</text>
    <text x="540" y="490" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Type · Details · Submit</text>
  </g>
  <line x1="540" y1="502" x2="540" y2="528" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="430" y="530" width="220" height="44" rx="14" fill="#6366F1"/>
    <text x="540" y="557" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Claim Number Issued</text>
  </g>

  <!-- Legend -->
  <rect x="40" y="860" width="640" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="890" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Legend &amp; Screen Map</text>

  <rect x="60" y="910" width="16" height="16" rx="4" fill="#0EA5E9"/>
  <text x="86" y="923" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">New policy purchase path (Steps 1–4)</text>

  <rect x="60" y="938" width="16" height="16" rx="4" fill="#6366F1"/>
  <text x="86" y="951" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">Existing policy / Claim path</text>

  <rect x="60" y="966" width="16" height="16" rx="4" fill="#16A34A"/>
  <text x="86" y="979" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">Success state</text>

  <line x1="60" y1="1005" x2="90" y2="1005" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="100" y="1009" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">After success → My Policies</text>

  <text x="60" y="1040" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Screens: CarInsuranceLanding → VehicleDetails → PersonalDetails → CoverageSelection</text>
  <text x="60" y="1058" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">→ QuoteSummary → PolicyReview → InsurancePayment → PolicySuccess → MyPolicies / ClaimType</text>
</svg>
